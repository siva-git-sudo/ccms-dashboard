<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCMS Dashboard</title>
<style>
  :root{
    --bg:#f4f5f3; --panel:#ffffff; --line:#e6e4dd; --line-2:#d3d0c6;
    --ink:#1b1c1a; --ink-2:#63665f; --ink-3:#9b9d95;
    --grn:#1d6b40; --grn-bg:#e8f4ec; --red:#b3251d; --red-bg:#fbecea;
    --acc:#16559b; --acc-bg:#e9f0f8; --head:#f3f2ee;
    --forest:#1f4d33; --forest-2:#2d6a47;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1640px;margin:0 auto;padding:0 22px 60px}

  /* The masthead is a white band with a single green hairline on top --
     the colour signals the department without spending a fifth of the
     first screen on a slab of it, and it lets the KPI strip below be the
     first thing the eye lands on. */
  header.top{background:var(--panel);border-top:3px solid var(--forest);
    border-bottom:1px solid var(--line)}
  /* One header at both widths: the compact treatment the phone needed
     turned out to be the right one everywhere -- the masthead is
     orientation, not content, and the KPI strip should be the first
     thing the eye lands on. Only the horizontal padding still varies. */
  header.top .inner{max-width:1640px;margin:0 auto;padding:10px 22px 11px}
  header.top .brand{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  header.top .mark{flex:none;width:26px;height:26px;border-radius:7px;
    background:var(--forest);display:flex;align-items:center;justify-content:center}
  header.top .mark svg{width:15px;height:15px}
  header.top .ttl{min-width:0}
  header.top h1{font-size:18.5px;font-weight:600;margin:0;color:var(--ink);
    letter-spacing:-.014em;line-height:1.2}
  /* The subtitle carries the currency of the data rather than the
     department's full name -- which report you are looking at matters
     less than how old it is, and the old green pill said the same thing
     twice as far from the title. */
  header.top .org{margin:1px 0 0;font-size:13px;color:var(--ink-2);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .stamp{color:var(--grn);font-weight:600;white-space:nowrap}
  .hmeta{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:9px}
  /* Names the segment beside it: three bare durations do not say what
     they re-base. */
  .pslab{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    font-weight:700;color:var(--ink-3)}
  /* Period control. Re-bases every delta on the page. All three
     baselines are on show as one segment rather than folded into a
     select -- there are only three, and a visible set of options is one
     less control to learn. The full label ("weekly - vs 5d ago") rides
     along as each button's title and aria-label. */
  .pseg{display:inline-flex;align-items:center;border:1px solid var(--line-2);
    border-radius:999px;overflow:hidden;background:#fff}
  .pseg button{font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);
    background:none;border:0;border-left:1px solid var(--line-2);
    padding:4px 11px;cursor:pointer;white-space:nowrap;line-height:1.5}
  .pseg button:first-child{border-left:0}
  .pseg button:hover:not(:disabled){color:var(--forest-2)}
  .pseg button[aria-pressed="true"]{background:var(--grn-bg);color:var(--forest-2)}
  .pseg button:disabled{opacity:.42;cursor:default}

  /* Seven KPIs, one row. Fixed 7-up rather than auto-fit: the set is a
     single glance-able strip, and a card wrapping onto its own line reads
     as more important than the rest. minmax(0,...) lets them shrink
     instead of overflowing when the window is narrow. */
  .kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:20px 0 22px}
  /* Breakpoints moved out with the type: a 7-up strip of larger figures
     needs more room before the labels start stacking three lines deep. */
  @media (max-width:1320px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* Each KPI owns a hue: tinted face, saturated rail, saturated figure.
     The tint stays pale enough that the value keeps AA contrast on it. */
  .kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;
    background:var(--cbg,var(--panel));border:1px solid var(--cbd,var(--line));
    border-left:3px solid var(--c,var(--forest-2));border-radius:10px;
    padding:12px 14px 13px;transition:box-shadow .14s,transform .14s}
  .kpi:hover{box-shadow:0 3px 9px rgba(20,24,20,.09);transform:translateY(-1px)}
  /* Reserve two lines for the label so every value sits on one baseline. */
  .kpi .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.045em;
    color:var(--c,var(--ink-3));font-weight:700;line-height:1.32;min-height:2.64em}
  .kpi .vrow{display:flex;align-items:baseline;gap:7px;margin-top:auto;padding-top:6px;
    flex-wrap:wrap}
  .kpi .v{font-size:28px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
  /* The delta rides on a white chip so it stays legible on the tinted
     card face without competing with the figure itself. */
  .kpi .kd{font-size:13px;font-weight:700;padding:2px 6px;border-radius:5px;
    background:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .kd.increase{color:var(--red)}
  .kpi .kd.decrease{color:var(--grn)}
  .kpi .kd.same{color:var(--ink-3)}
  .kpi .d{font-size:13px;margin-top:4px;color:var(--ink-2);opacity:.85;line-height:1.35}
  .kpi.accent{border-color:var(--line-2)}
  .kpi.accent .v{color:var(--forest-2)}
  /* The seven hues, ordered so no two neighbours share a family. */
  .kpi.k1{--c:#1b6b40;--cbg:#eaf5ee;--cbd:#cbe5d6}  /* total       - green   */
  .kpi.k2{--c:#1a5aa8;--cbg:#eaf1fb;--cbd:#cadcf2}  /* High Court  - blue    */
  .kpi.k3{--c:#6f31a5;--cbg:#f3ecfb;--cbd:#dccef0}  /* KSAT        - violet  */
  .kpi.k4{--c:#b5342a;--cbg:#fdeceb;--cbd:#f4cfcc}  /* contempt    - red     */
  .kpi.k5{--c:#a8560c;--cbg:#fdf2e3;--cbd:#f2ddbf}  /* no action   - amber   */
  .kpi.k6{--c:#0a7373;--cbg:#e6f4f4;--cbd:#c3e4e4}  /* LCO         - teal    */
  .kpi.k7{--c:#9c2668;--cbg:#fceaf3;--cbd:#f2cbdf}  /* final order - magenta */

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:4px 16px 12px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,20,.03)}
  .frow{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:start;
    padding:12px 0}
  .frow + .frow{border-top:1px solid var(--line)}
  .fchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .flabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:600;padding-top:7px;line-height:1.2}
  /* Each filter row has its own hue so you can tell at a glance which
     level of the hierarchy you are looking at. --c sets the family. */
  .chip{font-size:14.5px;padding:6px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--c-bd);background:var(--c-bg);color:var(--c-fg);
    display:inline-flex;align-items:center;gap:6px;line-height:1.35;
    transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  .chip:hover{border-color:var(--c-fg);box-shadow:0 1px 3px rgba(20,24,20,.10)}
  .chip.on{background:var(--c-fg);border-color:var(--c-fg);color:#fff}
  .chip.on:hover{background:var(--c-fg)}
  .chip .n{font-size:12px;font-weight:600;padding:1px 6px;border-radius:999px;
    background:rgba(255,255,255,.72);color:var(--c-fg);min-width:20px;text-align:center}
  .chip.on .n{background:rgba(255,255,255,.24);color:#fff}
  .chip.zero{opacity:.45}
  .chip.zero.on{opacity:1}
  /* Chip delta. Sits after the count, deliberately smaller than it: the
     count is what you filter on, the delta is context. Absent entirely
     when there is no change, so a busy row stays readable. */
  .chip .cd{font-size:11.5px;font-weight:700;margin-left:-1px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .chip .cd.increase{color:var(--red)}
  .chip .cd.decrease{color:var(--grn)}
  .chip.on .cd{color:#fff;opacity:.9}

  .frow.f-circle{--c-bg:#eaf1fa; --c-bd:#c2d6ee; --c-fg:#16559b}  /* blue    */
  .frow.f-unit  {--c-bg:#e9f4ec; --c-bd:#bfdfc9; --c-fg:#1d6b40}  /* green   */
  .frow.f-court {--c-bg:#f0ecf8; --c-bd:#d3c8ea; --c-fg:#5a3fa0}  /* purple  */
  .frow.f-type  {--c-bg:#fdf0e4; --c-bd:#f0d6bb; --c-fg:#a05a17}  /* orange  */
  .frow.f-stage {--c-bg:#fbeaee; --c-bd:#eec6d0; --c-fg:#9b2f4c}  /* rose    */
  .frow .flabel{color:var(--c-fg);opacity:.85}
  .fhint{font-size:14px;color:var(--ink-3);align-self:center}
  /* Divides the wing chips from the division chips inside the one
     Wings / Divisions row. */
  .fsep{width:1px;align-self:stretch;margin:2px 4px;background:var(--c-bd)}
  /* Sits on its own line above the table, separated by a rule -- it is
     an escape from the filters, not one of them, and it should not look
     like a chip. */
  .fresetrow{border-top:1px solid var(--line);padding:9px 0 2px;text-align:right}
  .freset{display:inline-flex;align-items:center;gap:6px;font-size:13px;
    color:var(--ink-3);cursor:pointer;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line-2);background:#fff}
  .freset i{font-style:normal;font-size:14px;line-height:1}
  .freset:hover{border-color:var(--red);color:var(--red)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(20,24,20,.04)}
  .phead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .phead h2{font-size:17.5px;font-weight:600;margin:0;letter-spacing:-.005em}
  .phead .m{font-size:14px;color:var(--ink-3)}
  .badge{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--acc-bg);
    color:var(--acc);margin-left:7px;vertical-align:1px}

  .scroll{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
  /* Headings wrap between words and never inside one. Hyphenating
     "authorization" across two lines to save a few pixels made the row
     of headings unreadable at a glance, which is the only thing that row
     is for. Columns size to their own longest word rather than to a
     single fixed width -- "Disposed case" does not need the room
     "GA/LCO Authorization pending" does -- and are capped so no one
     heading can run away with the table. Right-aligned and
     bottom-aligned, so every heading ends on the same baseline directly
     above the figures it names. The table scrolls sideways when 17 of
     them will not fit; that is the honest tradeoff for legible type. */
  thead th{background:var(--head);font-weight:600;color:var(--ink-2);text-align:right;
    padding:8px 6px;border-bottom:1px solid var(--line-2);
    vertical-align:bottom;font-size:11.5px;line-height:1.3;
    white-space:normal;overflow-wrap:normal;word-break:keep-all;hyphens:none;
    width:auto;min-width:64px;max-width:94px}
  thead th.grp{text-align:center;border-left:1px solid var(--line-2);
    border-right:1px solid var(--line-2);text-transform:uppercase;letter-spacing:.04em;
    font-size:11.5px;width:auto;max-width:none;padding-bottom:5px}
  th.nm,td.nm{text-align:left;position:sticky;left:0;z-index:2;
    width:192px;min-width:192px;max-width:192px}
  thead th.nm{background:var(--head);vertical-align:bottom}
  tbody td.nm{background:var(--panel);border-right:1px solid var(--line);
    white-space:normal;overflow-wrap:break-word}
  tbody tr.u td.nm{background:#fafaf7}
  tbody td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:hover td{background:#fafaf8}
  tbody tr:hover td.nm{background:#f2f2ee}
  tbody tr.u td{color:var(--ink-2);font-size:13.5px}
  tbody tr.u td.nm{padding-left:24px}
  /* Wing subtotal row -- HQ units only, sits between the unit and its users. */
  tbody tr.wg td{font-size:13.5px;font-weight:600;background:#f6f5ef}
  tbody tr.wg td.nm{padding-left:24px;background:#f2f1e9;
    border-left:3px solid var(--ink-3)}
  tbody tr.wg.um td.nm{border-left-color:#d9a441;color:#8a6a1c}
  tbody tr.wg .tot{background:#e9eef6!important}
  tbody tr.u.inw td.nm{padding-left:40px}
  .z{color:#c4c6bf}
  .tot{font-weight:600;background:var(--acc-bg)!important}
  tbody tr.u .tot{background:#eff4fa!important}
  th.stg,.stg{background:#fdf3e3!important}
  tbody tr.u .stg{background:#fbf6ec!important}
  th.stg{box-shadow:inset 0 -2px 0 #d9a441}
  tfoot td{padding:9px 7px;text-align:right;font-weight:600;border-top:2px solid var(--line-2);
    background:var(--head);white-space:nowrap;font-variant-numeric:tabular-nums}
  tfoot td.nm{text-align:left;position:sticky;left:0;background:var(--head);white-space:normal}

  .dn{display:flex;align-items:flex-start;gap:6px;font-weight:600;line-height:1.3}
  /* The division name is the control that reveals its user rows -- a
     dotted underline reads as "there is more here" without spending a
     column on a disclosure triangle. Solid once open. */
  .dl{color:var(--acc);cursor:pointer;text-decoration:underline;
    text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px}
  .dl:hover{text-decoration-style:solid}
  .dl.open{text-decoration-style:solid;color:var(--ink)}
  .gt{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:500}
  /* One delta rule across the whole page: red is the wrong direction,
     green is the right one. Every figure these sit on is a pending
     count, so a rise is a growing backlog and reads red. The single
     exception is the Completed group, which counts closed cases -- it
     asks for .up/.down instead, so the same colours keep meaning
     "worse" and "better" rather than flipping meaning per widget. */
  .d{font-size:12px;font-weight:600;margin-left:5px;padding:1px 5px;border-radius:4px}
  .d.increase{color:var(--red);background:var(--red-bg)}
  .d.decrease{color:var(--grn);background:var(--grn-bg)}
  .d.baseline,.d.same{color:var(--ink-3)}
  .us{font-size:13px;color:var(--ink-3);font-weight:400;margin-top:1px}
  .note{margin:12px 0 0;padding:10px 13px;font-size:14px;border-radius:9px;
    background:#fdf7e8;color:#6a5415;border:1px solid #f0e3c0;line-height:1.5}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:16px}
  .btn{font-size:14.5px;border:1px solid var(--line-2);background:#fff;padding:6px 12px;
    border-radius:8px;cursor:pointer;color:var(--ink-2)}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .lg{font-size:14px;color:var(--ink-2);display:flex;gap:13px;align-items:center}

  /* ---- Mobile (<=640px) --------------------------------------------
     Filter rows stack label-over-chips instead of a fixed 104px label
     column; HQ/Circle and Wings/Divisions collapse to a one-line
     summary once onboarding (or a manual pick) has answered them, with
     Court and Case type left fully expanded since those stay live. The
     wide table is replaced entirely by tap-to-expand cards -- see
     .mcards below -- so no table CSS needs a mobile override. */
  @media (max-width:640px){
    /* The masthead is already compact at every width -- see header.top
       above. A phone changes the side padding, drops the trend row to
       full width, and breaks the subtitle in two: clamped to one line
       the date is the half that gets cut, and the date is the half
       worth reading. */
    header.top .inner{padding:10px 14px 11px}
    header.top .org{-webkit-line-clamp:2}
    header.top .org .osep{display:none}
    header.top .org .stamp{display:block}
    .hmeta{width:100%;margin-left:0;justify-content:space-between;gap:8px}

    .frow{grid-template-columns:1fr;row-gap:6px}
    .flabel{padding-top:0}

    .fsum{display:flex;align-items:center;justify-content:space-between;gap:8px;
      border-radius:9px;padding:8px 11px;cursor:pointer;
      border:1px solid var(--c-bd);background:var(--c-bg);color:var(--c-fg)}
    .fsum .fsl{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
    .fsum .n{font-size:10.5px;font-weight:600;background:rgba(255,255,255,.72);
      border-radius:999px;padding:1px 7px}
    .fsum .chg{font-size:12px;font-weight:600;text-decoration:underline;
      text-underline-offset:2px;white-space:nowrap}

    .ctgrp{margin-bottom:9px}
    .ctgrp:last-child{margin-bottom:0}
    .ctgrp .gl{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}

    .mcards{padding:12px}
    .mcard{border:1px solid var(--line);border-radius:11px;padding:11px 12px;
      margin-bottom:9px;background:var(--panel)}
    .mcard:last-child{margin-bottom:0}
    .mcard .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .mcard .mname{font-size:14px;font-weight:600;color:var(--ink)}
    .mcard .mtot{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
      white-space:nowrap}
    .mcard .mmeta{display:flex;align-items:center;justify-content:space-between;
      gap:8px;font-size:12px;color:var(--ink-2);margin-top:2px}
    /* The whole card is the tap target -- a collapsed card is a name and
       a case number, and opening it brings the metrics and the roster
       together. The chevron is the only affordance it needs. */
    .mcard{cursor:pointer}
    .mcard.on{border-color:var(--forest-2)}
    .mcard .mchev{flex:none;font-size:10.5px;color:var(--ink-3)}
    .mcard.on .mchev{color:var(--forest-2)}
    .mcard .mrecv{font-size:10.5px;color:var(--ink-3);margin-top:2px}
    .mcrumb{font-size:11px;color:var(--ink-3);margin-bottom:7px}
    .mcrumb .cur{color:var(--ink);font-weight:600}

    .mgrp{margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
    .mgrp .gl{display:flex;align-items:baseline;justify-content:space-between;
      font-size:10.5px;font-weight:700;text-transform:uppercase;
      letter-spacing:.045em;color:var(--ink-2);margin-bottom:5px}
    .mgrp .gl .gt2{font-size:11px;letter-spacing:0;text-transform:none;
      font-weight:600;color:var(--ink)}
    .mgrp.done .gl{color:var(--grn)}
    .mtags{display:flex;flex-wrap:wrap;gap:6px}
    .mtag{font-size:10.5px;background:#f2f1ea;color:var(--ink-2);border-radius:6px;
      padding:4px 8px;line-height:1.3}
    .mtag b{color:var(--ink);font-weight:700;margin-left:2px}
    .mtag.done{background:var(--grn-bg);color:var(--grn)}
    .mtag.done b{color:var(--grn)}
    .mtag.warn{background:#fdf3e3;color:#8a6a1c}
    .mtag.warn b{color:#8a6a1c}

    /* Phase blocks. The rail carries the colour so the chips can stay
       pale enough to keep their figures legible; each phase owns one
       hue across rail, header text and chip tint. */
    .phb{border-left:3px solid var(--ph);padding-left:8px;margin-bottom:8px}
    .phb:last-child{margin-bottom:0}
    .phb .phh{display:flex;align-items:baseline;justify-content:space-between;
      gap:8px;font-size:10.5px;font-weight:600;color:var(--ph-fg);margin-bottom:4px}
    .phb .phn{font-variant-numeric:tabular-nums;white-space:nowrap}
    .phb .mtag{background:var(--ph-bg);color:var(--ph-fg)}
    .phb .mtag b{color:var(--ph-fg)}
    .ph-st{--ph:#c0392f;--ph-fg:#8f2b23;--ph-bg:#fbeceb}
    .ph-pr{--ph:#c98a12;--ph-fg:#83590a;--ph-bg:#fbf1de}
    .ph-ad{--ph:#7a5cc4;--ph-fg:#54399a;--ph-bg:#efecfb}
    .ph-ct{--ph:#2f6fb5;--ph-fg:#1f5289;--ph-bg:#e9f1fa}
    .ph-po{--ph:#1d8a68;--ph-fg:#12654a;--ph-bg:#e4f3ec}
    .ph-dn{--ph:#7d7b72;--ph-fg:#4a4844;--ph-bg:#f2f1ea}
    .ph-ot{--ph:#9a988e;--ph-fg:#5d5b53;--ph-bg:#f2f1ea}
    /* Same rule as the rest of the page -- see .d above. */
    .md{font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
    .md.sm{font-size:10.5px;margin-left:3px;opacity:.9}
    .md.increase,.md.down{color:var(--red)}
    .md.decrease,.md.up{color:var(--grn)}
    .md.same{color:var(--ink-3)}

    .museres{margin-top:9px;padding-top:7px;border-top:1px solid var(--line)}
    .museres .usl{font-size:10.5px;font-weight:700;text-transform:uppercase;
      letter-spacing:.045em;color:var(--ink-2);margin-bottom:2px}

  }
</style>
</head>

          <path d="M12 21v-9"/>

          <path d="M12 16.5c0-3.1-2-5.6-5.6-6.2C6.2 14 8.5 16.5 12 16.5z"/>

  <div id="panel"></div>
