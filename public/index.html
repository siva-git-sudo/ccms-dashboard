<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCMS Dashboard</title>
<style>
  :root{
    --bg:#f4f5f3; --panel:#ffffff; --line:#e6e4dd; --line-2:#d3d0c6;
    --ink:#1b1c1a; --ink-2:#63665f; --ink-3:#9b9d95;
    --grn:#1d6b40; --grn-bg:#e8f4ec; --red:#b3251d; --red-bg:#fbecea;
    --acc:#16559b; --acc-bg:#e9f0f8; --head:#f3f2ee;
    --forest:#1f4d33; --forest-2:#2d6a47;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1640px;margin:0 auto;padding:0 22px 60px}

  /* The masthead is a white band with a single green hairline on top --
     the colour signals the department without spending a fifth of the
     first screen on a slab of it, and it lets the KPI strip below be the
     first thing the eye lands on. */
  header.top{background:var(--panel);border-top:3px solid var(--forest);
    border-bottom:1px solid var(--line)}
  header.top .inner{max-width:1640px;margin:0 auto;padding:16px 22px 17px}
  header.top .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header.top .mark{flex:none;width:34px;height:34px;border-radius:9px;
    background:var(--forest);display:flex;align-items:center;justify-content:center}
  header.top .ttl{min-width:0}
  header.top h1{font-size:18.5px;font-weight:600;margin:0;color:var(--ink);
    letter-spacing:-.014em;line-height:1.25}
  header.top .org{margin:2px 0 0;font-size:12px;color:var(--ink-2);line-height:1.4}
  /* Cap the measure -- the scope line is a long sentence and full-bleed
     lines at 1640px are genuinely hard to track back from. */
  header.top .sub{margin:11px 0 0;font-size:11.5px;color:var(--ink-3);
    line-height:1.5;max-width:1020px}
  .hmeta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  .stamp{font-size:11.5px;color:var(--grn);background:var(--grn-bg);
    border:1px solid #cde3d6;border-radius:999px;padding:5px 12px;white-space:nowrap}
  /* Period selector. Re-bases every delta on the page; deliberately a
     plain select rather than another control to learn. */
  .periodsel{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;
    color:var(--ink-3)}
  .periodsel > span{text-transform:uppercase;letter-spacing:.05em;font-weight:700;
    font-size:9.5px}
  .periodsel select{font:inherit;font-size:11.5px;color:var(--ink-2);background:#fff;
    border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;cursor:pointer}
  .periodsel select:hover{border-color:var(--forest-2);color:var(--forest-2)}
  .periodsel select:disabled{opacity:.55;cursor:default}

  /* Seven KPIs, one row. Fixed 7-up rather than auto-fit: the set is a
     single glance-able strip, and a card wrapping onto its own line reads
     as more important than the rest. minmax(0,...) lets them shrink
     instead of overflowing when the window is narrow. */
  .kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:20px 0 22px}
  @media (max-width:1180px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:760px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  /* Each KPI owns a hue: tinted face, saturated rail, saturated figure.
     The tint stays pale enough that the value keeps AA contrast on it. */
  .kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;
    background:var(--cbg,var(--panel));border:1px solid var(--cbd,var(--line));
    border-left:3px solid var(--c,var(--forest-2));border-radius:10px;
    padding:11px 13px 12px;transition:box-shadow .14s,transform .14s}
  .kpi:hover{box-shadow:0 3px 9px rgba(20,24,20,.09);transform:translateY(-1px)}
  /* Reserve two lines for the label so every value sits on one baseline. */
  .kpi .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.045em;
    color:var(--c,var(--ink-3));font-weight:700;line-height:1.32;min-height:2.64em}
  .kpi .vrow{display:flex;align-items:baseline;gap:7px;margin-top:auto;padding-top:6px;
    flex-wrap:wrap}
  .kpi .v{font-size:23px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
  /* The delta rides on a white chip so it stays legible on the tinted
     card face without competing with the figure itself. */
  .kpi .kd{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:5px;
    background:rgba(255,255,255,.78);font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .kd.increase{color:var(--grn)}
  .kpi .kd.decrease{color:var(--red)}
  .kpi .kd.same{color:var(--ink-3)}
  .kpi .d{font-size:10.5px;margin-top:4px;color:var(--ink-2);opacity:.85;line-height:1.35}
  .kpi.accent{border-color:var(--line-2)}
  .kpi.accent .v{color:var(--forest-2)}
  /* The seven hues, ordered so no two neighbours share a family. */
  .kpi.k1{--c:#1b6b40;--cbg:#eaf5ee;--cbd:#cbe5d6}  /* total       - green   */
  .kpi.k2{--c:#1a5aa8;--cbg:#eaf1fb;--cbd:#cadcf2}  /* High Court  - blue    */
  .kpi.k3{--c:#6f31a5;--cbg:#f3ecfb;--cbd:#dccef0}  /* KSAT        - violet  */
  .kpi.k4{--c:#b5342a;--cbg:#fdeceb;--cbd:#f4cfcc}  /* contempt    - red     */
  .kpi.k5{--c:#a8560c;--cbg:#fdf2e3;--cbd:#f2ddbf}  /* no action   - amber   */
  .kpi.k6{--c:#0a7373;--cbg:#e6f4f4;--cbd:#c3e4e4}  /* LCO         - teal    */
  .kpi.k7{--c:#9c2668;--cbg:#fceaf3;--cbd:#f2cbdf}  /* final order - magenta */

  .filters{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:4px 16px 12px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,24,20,.03)}
  .frow{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start;
    padding:11px 0}
  .frow + .frow{border-top:1px solid var(--line)}
  .fchips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .flabel{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    font-weight:600;padding-top:7px;line-height:1.2}
  /* Each filter row has its own hue so you can tell at a glance which
     level of the hierarchy you are looking at. --c sets the family. */
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;
    border:1px solid var(--c-bd);background:var(--c-bg);color:var(--c-fg);
    display:inline-flex;align-items:center;gap:6px;line-height:1.35;
    transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
  .chip:hover{border-color:var(--c-fg);box-shadow:0 1px 3px rgba(20,24,20,.10)}
  .chip.on{background:var(--c-fg);border-color:var(--c-fg);color:#fff}
  .chip.on:hover{background:var(--c-fg)}
  .chip .n{font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;
    background:rgba(255,255,255,.72);color:var(--c-fg);min-width:20px;text-align:center}
  .chip.on .n{background:rgba(255,255,255,.24);color:#fff}
  .chip.zero{opacity:.45}
  .chip.zero.on{opacity:1}
  /* Chip delta. Sits after the count, deliberately smaller than it: the
     count is what you filter on, the delta is context. Absent entirely
     when there is no change, so a busy row stays readable. */
  .chip .cd{font-size:9.5px;font-weight:700;margin-left:-1px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .chip .cd.increase{color:var(--grn)}
  .chip .cd.decrease{color:var(--red)}
  .chip.on .cd{color:#fff;opacity:.9}

  .frow.f-circle{--c-bg:#eaf1fa; --c-bd:#c2d6ee; --c-fg:#16559b}  /* blue    */
  .frow.f-unit  {--c-bg:#e9f4ec; --c-bd:#bfdfc9; --c-fg:#1d6b40}  /* green   */
  .frow.f-court {--c-bg:#f0ecf8; --c-bd:#d3c8ea; --c-fg:#5a3fa0}  /* purple  */
  .frow.f-type  {--c-bg:#fdf0e4; --c-bd:#f0d6bb; --c-fg:#a05a17}  /* orange  */
  .frow.f-stage {--c-bg:#fbeaee; --c-bd:#eec6d0; --c-fg:#9b2f4c}  /* rose    */
  .frow .flabel{color:var(--c-fg);opacity:.85}
  .fhint{font-size:11.5px;color:var(--ink-3);align-self:center}
  /* Divides the wing chips from the division chips inside the one
     Wings / Divisions row. */
  .fsep{width:1px;align-self:stretch;margin:2px 4px;background:var(--c-bd)}
  .freset{font-size:11.5px;color:var(--acc);cursor:pointer;margin-left:4px;
    text-decoration:underline;text-underline-offset:2px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 1px 2px rgba(20,24,20,.04)}
  .phead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .phead h2{font-size:14.5px;font-weight:600;margin:0;letter-spacing:-.005em}
  .phead .m{font-size:11.5px;color:var(--ink-3)}
  .badge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--acc-bg);
    color:var(--acc);margin-left:7px;vertical-align:1px}

  .scroll{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
  thead th{background:var(--head);font-weight:600;color:var(--ink-2);text-align:right;
    padding:8px 7px;border-bottom:1px solid var(--line-2);
    vertical-align:bottom;font-size:10px;line-height:1.28;
    white-space:normal;overflow-wrap:break-word;hyphens:auto;
    width:74px;min-width:74px;max-width:74px}
  thead th.grp{text-align:center;border-left:1px solid var(--line-2);
    border-right:1px solid var(--line-2);text-transform:uppercase;letter-spacing:.04em;
    font-size:9.5px;width:auto;max-width:none;padding-bottom:5px}
  th.nm,td.nm{text-align:left;position:sticky;left:0;z-index:2;
    width:232px;min-width:232px;max-width:232px}
  thead th.nm{background:var(--head);vertical-align:bottom}
  tbody td.nm{background:var(--panel);border-right:1px solid var(--line);
    white-space:normal;overflow-wrap:break-word}
  tbody tr.u td.nm{background:#fafaf7}
  tbody td{padding:7px;text-align:right;border-bottom:1px solid var(--line);
    white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:hover td{background:#fafaf8}
  tbody tr:hover td.nm{background:#f2f2ee}
  tbody tr.u td{color:var(--ink-2);font-size:11px}
  tbody tr.u td.nm{padding-left:24px}
  /* Wing subtotal row -- HQ units only, sits between the unit and its users. */
  tbody tr.wg td{font-size:11px;font-weight:600;background:#f6f5ef}
  tbody tr.wg td.nm{padding-left:24px;background:#f2f1e9;
    border-left:3px solid var(--ink-3)}
  tbody tr.wg.um td.nm{border-left-color:#d9a441;color:#8a6a1c}
  tbody tr.wg .tot{background:#e9eef6!important}
  tbody tr.u.inw td.nm{padding-left:40px}
  .z{color:#c4c6bf}
  .tot{font-weight:600;background:var(--acc-bg)!important}
  tbody tr.u .tot{background:#eff4fa!important}
  th.stg,.stg{background:#fdf3e3!important}
  tbody tr.u .stg{background:#fbf6ec!important}
  th.stg{box-shadow:inset 0 -2px 0 #d9a441}
  tfoot td{padding:9px 7px;text-align:right;font-weight:600;border-top:2px solid var(--line-2);
    background:var(--head);white-space:nowrap;font-variant-numeric:tabular-nums}
  tfoot td.nm{text-align:left;position:sticky;left:0;background:var(--head);white-space:normal}

  .dn{display:flex;align-items:flex-start;gap:6px;font-weight:600;line-height:1.3}
  /* The division name is the control that reveals its user rows -- a
     dotted underline reads as "there is more here" without spending a
     column on a disclosure triangle. Solid once open. */
  .dl{color:var(--acc);cursor:pointer;text-decoration:underline;
    text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px}
  .dl:hover{text-decoration-style:solid}
  .dl.open{text-decoration-style:solid;color:var(--ink)}
  .gt{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:500}
  .d{font-size:10px;font-weight:600;margin-left:5px;padding:1px 5px;border-radius:4px}
  .d.increase{color:var(--grn);background:var(--grn-bg)}
  .d.decrease{color:var(--red);background:var(--red-bg)}
  .d.baseline,.d.same{color:var(--ink-3)}
  .us{font-size:10.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
  .note{margin:12px 0 0;padding:10px 13px;font-size:11.5px;border-radius:9px;
    background:#fdf7e8;color:#6a5415;border:1px solid #f0e3c0;line-height:1.5}
  .empty{padding:34px 16px;text-align:center;color:var(--ink-3);font-size:13px}
  .btn{font-size:12px;border:1px solid var(--line-2);background:#fff;padding:6px 12px;
    border-radius:8px;cursor:pointer;color:var(--ink-2)}
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .lg{font-size:11.5px;color:var(--ink-2);display:flex;gap:13px;align-items:center}

  /* ---- Mobile (<=640px) --------------------------------------------
     Filter rows stack label-over-chips instead of a fixed 104px label
     column; HQ/Circle and Wings/Divisions collapse to a one-line
     summary once onboarding (or a manual pick) has answered them, with
     Court and Case type left fully expanded since those stay live. The
     wide table is replaced entirely by tap-to-expand cards -- see
     .mcards below -- so no table CSS needs a mobile override. */
  @media (max-width:640px){
    .frow{grid-template-columns:1fr;row-gap:6px}
    .flabel{padding-top:0}

    .fsum{display:flex;align-items:center;justify-content:space-between;gap:8px;
      border-radius:9px;padding:8px 11px;cursor:pointer;
      border:1px solid var(--c-bd);background:var(--c-bg);color:var(--c-fg)}
    .fsum .fsl{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
    .fsum .n{font-size:9.5px;font-weight:600;background:rgba(255,255,255,.72);
      border-radius:999px;padding:1px 7px}
    .fsum .chg{font-size:10.5px;font-weight:600;text-decoration:underline;
      text-underline-offset:2px;white-space:nowrap}

    .ctgrp{margin-bottom:9px}
    .ctgrp:last-child{margin-bottom:0}
    .ctgrp .gl{font-size:9.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}

    .mcards{padding:12px}
    .mcard{border:1px solid var(--line);border-radius:11px;padding:10px 11px;
      margin-bottom:8px;background:var(--panel)}
    .mcard:last-child{margin-bottom:0}
    .mcard .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .mcard .mname{font-size:12.5px;font-weight:600;color:var(--ink)}
    .mcard .mname.lk{color:var(--acc);text-decoration:underline dotted;
      text-decoration-thickness:1px;text-underline-offset:3px}
    .mcard .mtot{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
      white-space:nowrap}
    .mcard .mmeta{font-size:10.5px;color:var(--ink-2);margin-top:2px}
    .mcard .mrecv{font-size:9.5px;color:var(--ink-3);margin-top:2px}
    .mcrumb{font-size:10px;color:var(--ink-3);margin-bottom:7px}
    .mcrumb .cur{color:var(--ink);font-weight:600}

    .mgrp{margin-top:8px;padding-top:7px;border-top:1px solid var(--line)}
    .mgrp .gl{font-size:8.5px;font-weight:700;text-transform:uppercase;
      letter-spacing:.045em;color:var(--ink-2);margin-bottom:5px}
    .mgrp.done .gl{color:var(--grn)}
    .mtags{display:flex;flex-wrap:wrap;gap:5px}
    .mtag{font-size:9.5px;background:#f2f1ea;color:var(--ink-2);border-radius:6px;
      padding:3px 7px;line-height:1.3}
    .mtag b{color:var(--ink);font-weight:700;margin-left:2px}
    .mtag.done{background:var(--grn-bg);color:var(--grn)}
    .mtag.done b{color:var(--grn)}
    .mtag.warn{background:#fdf3e3;color:#8a6a1c}
    .mtag.warn b{color:#8a6a1c}

    .mshow{display:flex;align-items:center;gap:4px;margin-top:9px;
      font-size:10.5px;color:var(--acc);cursor:pointer}
    .museres{margin-top:7px;padding-top:2px}
    .muser{border-left:2px solid var(--line-2);padding:7px 0 7px 9px;
      margin-top:6px;cursor:pointer}
    .muser:hover{border-left-color:var(--acc)}
    .mback{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:9px;
      border-top:1px solid var(--line);font-size:10.5px;color:var(--acc);cursor:pointer}

    /* First-visit preference sheet -- mobile only, one-time. */
    .obk-ov{position:fixed;inset:0;background:rgba(20,24,20,.42);
      display:flex;align-items:flex-end;z-index:80}
    .obk-sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;
      padding:16px 16px 18px;max-height:82vh;overflow-y:auto}
    .obk-grab{width:32px;height:3px;background:var(--line-2);border-radius:2px;
      margin:0 auto 14px}
    .obk-t{font-size:14px;font-weight:600;margin:0 0 4px;color:var(--ink)}
    .obk-d{font-size:11px;color:var(--ink-3);margin:0 0 12px;line-height:1.4}
    .obk-list{max-height:44vh;overflow-y:auto}
    .obk-opt{border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;
      margin-bottom:6px;font-size:12.5px;cursor:pointer}
    .obk-opt:hover{border-color:var(--acc)}
    .obk-actions{display:flex;gap:8px;margin-top:14px}
    .obk-actions button{flex:1;font:inherit;font-size:12.5px;padding:9px;
      border-radius:9px;cursor:pointer}
    .obk-skip{border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
    .obk-save{border:none;background:var(--acc);color:#fff;font-weight:600}
  }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21v-9"/>
          <path d="M12 13c0-4.2 2.6-7.2 7.2-8.2C19.5 9.6 16.7 13 12 13z"/>
          <path d="M12 16.5c0-3.1-2-5.6-5.6-6.2C6.2 14 8.5 16.5 12 16.5z"/>
        </svg>
      </span>
      <div class="ttl">
        <h1>CCMS Dashboard</h1>
        <p class="org">Karnataka Forest Department &middot; Forest, Ecology and Environment</p>
      </div>
      <div class="hmeta">
        <div class="stamp" id="stamp">Loading&hellip;</div>
        <label class="periodsel">
          <span>Trend</span>
          <select id="period" onchange="setPeriod(this.value)"></select>
        </label>
      </div>
    </div>
    <p class="sub">Statewide &mdash; Aranya Bhavana HQ and all 13 circles (territorial, wildlife and social forestry divisions), before the High Court of Karnataka and the Karnataka State Administrative Tribunal.</p>
  </div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="filters" id="filters"></div>
  <div id="panel"></div>
</div>

<script src="data.js"></script>
<script>
// UNIT holds a division code (r.code) -- the individual unit under the
// selected circle -- or 'ALL'.
// WING holds an Aranya Bhavana wing name (from scraper/wings.json) or
// 'ALL'. It sits between Circle and Major unit: wings are a subdivision
// of the HQ units, so picking one narrows to those units *and* rewrites
// every row to that wing's share of them.
var DATA=null, COURT='ALL', CT=null, CIRCLE='ALL', WING='ALL', UNIT='ALL', STAGE='ALL';

// Sort order for the unit chips within a circle: the circle office
// first, then territorial, wildlife, social forestry.
var UNIT_ORDER={circle:0, hq:0, division:1, wildlife:2, sf:3};
var UNIT_KIND={hq:'Head office', circle:'Circle office', division:'Territorial',
               wildlife:'Wildlife', sf:'Social forestry'};

// ---- Mobile layout -------------------------------------------------
// Below 640px the page swaps the wide table for tap-to-expand cards and
// condenses the HQ/Circle and Wings/Divisions filter rows once they've
// been answered (by onboarding or a manual pick). Checked once at load
// rather than on resize -- a phone doesn't rotate into a data table.
var IS_MOBILE = window.matchMedia('(max-width:640px)').matches;
var MOB_CIRCLE_OPEN=false, MOB_UNIT_OPEN=false;
// Per-row card state, keyed by the row's position in the current ROWS
// array: {open: are its users shown, drill: index of a user being
// viewed in place of the division, or null}. Reset whenever a filter
// change could reorder or replace ROWS -- see the setters below --
// but left alone across a pure card interaction (renderPanel() runs
// after every toggle and must not forget what's open).
var MCARD={};
var LS_CIRCLE='ccms_pref_circle', LS_UNIT='ccms_pref_unit';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
// Attribute-safe JSON embed for onclick="" strings, same trick the
// desktop chip builder uses locally -- shared here for the onboarding
// sheet and the mobile card handlers.
function qa(v){ return JSON.stringify(v).replace(/"/g,'&quot;'); }
// 'YYYY-MM-DD' -> 'DD/MM'. The scraper's dates are always ISO, so this
// is a straight split rather than a real date parse.
function ddmm(iso){
  var p=String(iso||'').split('-');
  return p.length===3 ? (p[2]+'/'+p[1]) : (iso||'');
}

// Column headings, lightly trimmed so they wrap to two or three tidy
// lines instead of being abbreviated into something unreadable. The full
// report wording is always available on hover.
var SHORT={
  cases_received_as_on_yesterday:'Received as on yesterday',
  total_cases_pending:'Total cases pending',
  no_action_taken:'No action taken',
  lco_proposal_stage_pending:'LCO proposal stage',
  ga_lco_authorization_pending:'GA/LCO authorization pending',
  draft_pwr_pending:'Draft PWR pending',
  approved_pwr_pending:'Approved PWR pending',
  draft_so_pending_from_advocate:'Draft SO pending from advocate',
  approved_so_pending:'Approved SO pending',
  affidavit_filing_pending:'Affidavit filing pending',
  affidavit_filed_hearing_stage:'Affidavit filed, hearing stage',
  interim_order_compliance_pending:'Interim order compliance pending',
  disposed_case:'Disposed case',
  final_order_compliance_pending:'Final order compliance pending',
  proposed_for_appeal:'Proposed for appeal',
  closed_with_appeal_number:'Closed with appeal number',
  not_to_appeal:'Not to appeal'
};
var COMPLETED=['proposed_for_appeal','closed_with_appeal_number','not_to_appeal'];

// Stage filter -- narrows the table to units that actually have cases
// sitting at that stage, and highlights the column.
var STAGES=[
  {key:'no_action_taken',                label:'No action taken'},
  {key:'lco_proposal_stage_pending',     label:'LCO proposal'},
  {key:'disposed_case',                  label:'Disposed'},
  {key:'final_order_compliance_pending', label:'Final order'},
  {key:'not_to_appeal',                  label:'Not to appeal'}
];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function arw(d){return d==='increase'?'&#9650;':d==='decrease'?'&#9660;':'';}
// Delta for one row or officer under the active period. r.delta is only
// ever the daily figure, so it is not used for display -- differencing
// against base_metrics[PERIOD] is what makes the table follow the
// dropdown along with everything else.
function recDelta(rec){
  var b=baseOf(rec);
  if(!b) return {dir:'no_data',delta:null};
  var now=(rec.metrics||{}).total_cases_pending||0;
  var was=b.total_cases_pending;
  if(was===undefined||was===null) return {dir:'baseline',delta:null};
  var d=now-was;
  return {dir:d>0?'increase':(d<0?'decrease':'same'),delta:d};
}
function recDeltaHTML(rec){
  var x=recDelta(rec);
  return dHTML(x.dir,x.delta);
}
function dHTML(dir,delta){
  if(dir==='increase'||dir==='decrease')
    return '<span class="d '+dir+'">'+arw(dir)+(delta>0?'+':'')+delta+'</span>';
  if(dir==='baseline') return '<span class="d baseline">new</span>';
  return '';
}
function num(v){
  if(v===null||v===undefined) return '<span class="z">&mdash;</span>';
  if(v===0) return '<span class="z">0</span>';
  return v;
}
function shortOf(c){
  // Headings wrap now, so show the real wording rather than an
  // abbreviation. SHORT only lightly trims the longest report labels.
  return SHORT[c.key] || c.header || '';
}
function courtsOf(){
  var seen=[],out=[];
  DATA.case_types.forEach(function(ct){
    if(seen.indexOf(ct.court)<0){seen.push(ct.court);out.push(ct.court);}
  });
  return out;
}
function typesFor(court){
  return DATA.case_types.filter(function(ct){return court==='ALL'||ct.court===court;});
}
// A row narrowed to the selected wing: only that wing's users, and
// metrics re-summed over them. Returns null if the unit has no user in
// the wing, which is how units drop out of the table. With no wing
// selected the row is passed through untouched, so this costs nothing
// on the normal path.
//
// Every downstream count -- table, footer totals, KPIs, chip counts --
// goes through here, so selecting "Legal Cell" shows the Legal Cell
// caseload rather than the whole of Aranya Bhavana with a filter
// hint attached.
function scopeRow(r){
  if(WING==='ALL') return r;
  var us=r.users.filter(function(u){return u.wing===WING;});
  if(!us.length) return null;
  var m={},d=0,hasDelta=false,anyBaseline=false;
  us.forEach(function(u){
    for(var k in u.metrics){
      if(typeof u.metrics[k]==='number') m[k]=(m[k]||0)+u.metrics[k];
    }
    if(typeof u.delta==='number'){d+=u.delta;hasDelta=true;}
    else if(u.direction==='baseline') anyBaseline=true;
  });
  var dir=hasDelta?(d>0?'increase':d<0?'decrease':'same'):(anyBaseline?'baseline':'');
  return {code:r.code,name:r.name,group:r.group,circle:r.circle,
          metrics:m,delta:hasDelta?d:null,direction:dir,users:us};
}
// Rows of a case type after the circle, wing and unit filters.
function rowsOf(ct){
  if(!ct) return [];
  var out=[];
  ct.rows.forEach(function(r){
    if(CIRCLE!=='ALL' && r.circle!==CIRCLE) return;
    if(UNIT!=='ALL' && r.code!==UNIT) return;
    var s=scopeRow(r); if(!s) return;
    if(!(s.metrics.total_cases_pending>0)) return;
    if(STAGE!=='ALL' && !(s.metrics[STAGE]>0)) return;
    out.push(s);
  });
  return out;
}
// Wing chips are trimmed the same way division chips are.
function shortWing(name){
  return name.replace(/^Administration & Coordination$/,'Admin & Coord')
             .replace(/^Forest Resource Management$/,'Forest Resource Mgmt')
             .replace(/^Field offices under HQ code$/,'Field offices (misfiled)')
             .replace(/^System account \/ unallocated$/,'Unallocated');
}
// ---- Chip counts -------------------------------------------------------
//
// Every chip's number answers the same question: "if I click this, what
// will the table below total?" So each count is computed with all the
// *other* active filters applied and only its own facet overridden.
// Pick Aranya Bhavana, and the Court chips immediately show Aranya
// Bhavana's split between High Court and KSAT rather than the state's;
// pick Legal Cell as well, and they show Legal Cell's.
//
// tally() is that one calculation. `ov` overrides any of the six facets;
// `by` optionally buckets the result (by circle, wing, unit or stage)
// instead of returning a single number, so one pass fills a whole row of
// chips.
function tally(ov,by){
  var o={court:COURT,circle:CIRCLE,wing:WING,unit:UNIT,stage:STAGE,ct:null,metric:null,
         prev:false};
  for(var k in (ov||{})) o[k]=ov[k];
  var single=0,bucket={},meta={};

  DATA.case_types.forEach(function(ct){
    if(o.ct!==null && ct.key!==o.ct) return;
    if(o.court!=='ALL' && ct.court!==o.court) return;

    // Default statistic is the pending count. Pass o.metric (a regex on
    // the column header) to total something else instead -- the key for
    // the same statistic differs per report, so it is resolved here, per
    // report, rather than assumed. A report lacking the column simply
    // contributes nothing.
    var MK='total_cases_pending';
    if(o.metric){ MK=metricKey(ct,o.metric); if(!MK) return; }

    ct.rows.forEach(function(r){
      if(o.circle!=='ALL' && r.circle!==o.circle) return;
      if(o.unit!=='ALL' && r.code!==o.unit) return;

      // Bucketing by wing needs every wing, so it can't pre-filter to one.
      if(by==='wing'){
        (r.users||[]).forEach(function(u){
          if(!u.wing) return;
          var m=u.metrics;
          if(o.stage!=='ALL' && !(m[o.stage]>0)) return;
          var b=bucket[u.wing]||(bucket[u.wing]={total:0,users:0});
          b.total+=(o.prev?(baseOf(u)||{}):m)[MK]||0; b.users++;
        });
        return;
      }

      // pm shadows m throughout: the previous snapshot has to be summed
      // by exactly the same path as today, or a delta at wing level would
      // be today's wing against yesterday's whole division.
      var m=r.metrics,pm=baseOf(r)||{},n=(r.users||[]).length;
      if(o.wing!=='ALL'){
        var us=(r.users||[]).filter(function(u){return u.wing===o.wing;});
        if(!us.length) return;
        m={}; pm={}; n=us.length;
        us.forEach(function(u){
          for(var k2 in u.metrics){
            if(typeof u.metrics[k2]==='number') m[k2]=(m[k2]||0)+u.metrics[k2];
          }
          var upm=baseOf(u)||{};
          for(var k3 in upm){
            if(typeof upm[k3]==='number') pm[k3]=(pm[k3]||0)+upm[k3];
          }
        });
      }

      if(by==='stage'){
        STAGES.forEach(function(st){
          var v=(o.prev?pm:m)[st.key];
          if(typeof v!=='number') return;
          var b=bucket[st.key]||(bucket[st.key]={total:0,units:0});
          b.total+=v; if(v>0) b.units++;
        });
        return;
      }

      if(o.stage!=='ALL' && !(m[o.stage]>0)) return;
      var v=(o.prev?pm:m)[MK]||0;
      if(by==='circle'){
        (bucket[r.circle]||(bucket[r.circle]={total:0})).total+=v;
      }else if(by==='unit'){
        var b=bucket[r.code]||(bucket[r.code]={total:0});
        b.total+=v;
        meta[r.code]={name:r.name,group:r.group};
      }else{
        single+=v;
      }
      void n;
    });
  });

  if(!by) return single;
  if(by==='circle'){
    var seen={},order=[];
    (DATA.circles||[]).forEach(function(c){seen[c]=1;order.push(c);});
    Object.keys(bucket).forEach(function(c){if(!seen[c])order.push(c);});
    return order.map(function(c){return {name:c,total:(bucket[c]||{}).total||0};})
                .sort(function(a,b){return b.total-a.total;});
  }
  if(by==='wing'){
    var wo=DATA.wings||[];
    return Object.keys(bucket).map(function(w){
      return {name:w,total:bucket[w].total,users:bucket[w].users};
    }).sort(function(a,b){
      return (b.total-a.total)||(wo.indexOf(a.name)-wo.indexOf(b.name));
    });
  }
  if(by==='unit'){
    return Object.keys(bucket).map(function(c){
      return {code:c,name:meta[c].name,group:meta[c].group,total:bucket[c].total};
    }).sort(function(a,b){return b.total-a.total;});
  }
  return STAGES.map(function(st){
    var b=bucket[st.key]||{total:0,units:0};
    return {key:st.key,label:st.label,total:b.total,units:b.units};
  });
}

// Facet lists. Each row of chips ignores its own facet and honours the
// rest, so the counts describe what selecting that chip would give --
// which means also ignoring whatever that click would clear. Choosing a
// circle resets the wing/division below it, and wing and division reset
// each other, so all three are counted with those cleared.
function circleList(){ return tally({circle:'ALL',wing:'ALL',unit:'ALL'},'circle'); }
function wingList(){   return tally({wing:'ALL',unit:'ALL'},'wing'); }
function unitList(){   return tally({unit:'ALL',wing:'ALL'},'unit'); }
function stageList(){  return tally({stage:'ALL'},'stage'); }

// --- deltas -------------------------------------------------------------
// Every figure on the page can be differenced because the builder emits
// one baseline per period on every row and officer. That matters:
// a precomputed delta on one column could not answer "LCO pending, this
// wing, versus yesterday" -- yesterday has to be re-summed down the same
// filter path, which is what passing prev:true through tally() does.
function hasPrev(){ return periodOK(PERIOD); }
function withPrev(ov){
  var o={}; for(var k in (ov||{})) o[k]=ov[k];
  o.prev=true; return o;
}
// null means "nothing to compare against", which is not the same as 0.
function dlt(ov){
  if(!hasPrev()) return null;
  return tally(ov)-tally(withPrev(ov));
}
// Bucketed version: returns {key: delta} so a whole row of chips costs
// one extra pass rather than one per chip.
function dltBy(ov,by,keyOf){
  if(!hasPrev()) return null;
  var was={};
  tally(withPrev(ov),by).forEach(function(b){ was[keyOf(b)]=b.total; });
  return was;
}
function dHTMLsmall(delta){
  if(delta===null||delta===undefined||delta===0) return '';
  var dir=delta>0?'increase':'decrease';
  return '<span class="cd '+dir+'">'+(delta>0?'&#9650;':'&#9660;')+
         Math.abs(delta)+'</span>';
}
// Trim the repeated boilerplate so the chips stay readable.
function shortUnit(name){
  return name.replace(/ Division$/,'').replace(/^Forest Office /,'')
             .replace(/ Wildlife Division$/,' WL').replace(/ Social Forestry Division$/,' SF')
             .replace(/ SF Division$/,' SF').replace(/ Division SF$/,' SF');
}
// Pending for one case type under the active filters -- the number on
// its chip, and what the table beneath will total if it is selected.
function pend(ct){ return ct?tally({ct:ct.key}):0; }

function kn(v){return (typeof v==='number')?v.toLocaleString('en-IN'):v;}
function shortCourt(c){return c.indexOf('Administrative')>=0?'KSAT':'High Court';}

// --- KPI plumbing -------------------------------------------------------
// CCMS exports the same statistic under a different column key depending
// on the report: Writ Petition names it `no_action_taken`, Writ Appeal
// gives the identical column as `col_3`. Only the *header* is stable, so
// every cross-report KPI resolves its key by header text.
var KPI_COL={
  noAction: /^\s*No Action Taken/i,
  lco:      /^\s*LCO Proposal Stage/i,
  finalOrd: /^\s*Final Order Compliance Pending/i
};
function metricKey(ct,re){
  var cols=ct.columns||[];
  for(var i=0;i<cols.length;i++){
    if(re.test(cols[i].header||'')) return cols[i].key;
  }
  return null;
}
// How many of the reports in scope actually carry this column -- shown on
// the card so a low number is never mistaken for a real zero. Writ Appeal
// and S-KSAT have no "LCO Proposal Stage" column at all, only "GA/LCO
// Auth Pending", which is a different stage and deliberately not folded in.
function metricCoverage(re){
  var list=typesFor(COURT), have=0;
  list.forEach(function(ct){ if(metricKey(ct,re)) have++; });
  return {have:have,of:list.length};
}
function courtNamed(frag){
  var cs=courtsOf();
  for(var i=0;i<cs.length;i++){
    if(cs[i].toLowerCase().indexOf(frag)>=0) return cs[i];
  }
  return null;
}
function contemptTypes(){
  return DATA.case_types.filter(function(ct){return /contempt/i.test(ct.label||'');});
}

function renderKPIs(){
  var list=typesFor(COURT);
  var totalPending=list.reduce(function(s,c){return s+pend(c);},0);
  var divs={}, groupTotal={}, groupUnits={};
  list.forEach(function(ct){rowsOf(ct).forEach(function(r){
    divs[r.code]=1;
    var v=r.metrics.total_cases_pending||0;
    groupTotal[r.group]=(groupTotal[r.group]||0)+v;
    (groupUnits[r.group]||(groupUnits[r.group]={}))[r.code]=1;
  });});
  var users=0;
  list.forEach(function(ct){rowsOf(ct).forEach(function(r){users+=r.users.length;});});
  var active=list.filter(function(c){return pend(c)>0;}).length;
  var divCount=Object.keys(divs).length;

  var uLabel='';
  if(UNIT!=='ALL'){
    var u=unitList().filter(function(x){return x.code===UNIT;})[0];
    uLabel=' · '+(u?shortUnit(u.name):UNIT);
  }
  var sLabel='';
  if(STAGE!=='ALL'){
    var st=STAGES.filter(function(x){return x.key===STAGE;})[0];
    sLabel=' · '+(st?st.label:STAGE);
  }
  var scope = (COURT==='ALL' ? 'both courts' : COURT)+(CIRCLE==='ALL'?'':' · '+CIRCLE)+
              (WING==='ALL'?'':' · '+WING)+uLabel+sLabel;

  // Court totals. Each honours the court chip rather than overriding it,
  // so selecting KSAT shows High Court as a real zero instead of quietly
  // reporting the statewide figure the filter was meant to exclude.
  var hcName=courtNamed('high court'), ksName=courtNamed('administrative');
  var hcTotal=(hcName&&(COURT==='ALL'||COURT===hcName))?tally({court:hcName}):0;
  var ksTotal=(ksName&&(COURT==='ALL'||COURT===ksName))?tally({court:ksName}):0;

  // Contempt spans both forums: Civil Contempt Petition in the High Court
  // and Contempt Application in KSAT. Kept as one KPI with the split
  // underneath, because it is the exposure that carries personal
  // liability and it is read as a single number.
  var cHC=0,cKS=0;
  contemptTypes().forEach(function(ct){
    var v=tally({ct:ct.key});
    if(ct.court===ksName) cKS+=v; else cHC+=v;
  });
  var contempt=cHC+cKS;

  var noAction=tally({metric:KPI_COL.noAction});
  var lco     =tally({metric:KPI_COL.lco});
  var finalOrd=tally({metric:KPI_COL.finalOrd});
  var lcoCov  =metricCoverage(KPI_COL.lco);

  function share(v){
    return totalPending?((v*100/totalPending).toFixed(1)+'% of total'):'no cases in scope';
  }

  // "(all courts)" marks these four as cross-forum figures, but only
  // while that is true. Select a court and the tag drops off entirely:
  // the court chip above already states the scope, so repeating it on
  // four cards is noise, and leaving the words there would be a lie.
  var forum=(COURT==='ALL')?' (all courts)':'';

  // Deltas against the previous snapshot. Contempt spans two case types,
  // so its delta is the sum of theirs rather than a single tally.
  var dContempt=null;
  if(hasPrev()){
    dContempt=0;
    contemptTypes().forEach(function(ct){ dContempt+=dlt({ct:ct.key})||0; });
  }

  var cards=[
    {c:'k1',k:'Total cases',v:kn(totalPending),d:scope,dv:dlt({}),
     t:'Total cases pending, summed across every report in scope'},
    {c:'k2',k:'High Court',v:kn(hcTotal),d:share(hcTotal),
     dv:(hcName&&(COURT==='ALL'||COURT===hcName))?dlt({court:hcName}):null,
     t:'Writ Petition, Writ Appeal, Civil Contempt Petition and S-KSAT'},
    {c:'k3',k:'KSAT',v:kn(ksTotal),d:share(ksTotal),
     dv:(ksName&&(COURT==='ALL'||COURT===ksName))?dlt({court:ksName}):null,
     t:'Original, Contempt, Miscellaneous and Review Applications'},
    {c:'k4',k:'Contempt'+forum,v:kn(contempt),d:share(contempt),dv:dContempt,
     t:'Civil Contempt Petition (High Court) '+kn(cHC)+
       ' + Contempt Application (KSAT) '+kn(cKS)},
    {c:'k5',k:'No action'+forum,v:kn(noAction),d:share(noAction),
     dv:dlt({metric:KPI_COL.noAction}),
     t:'Cases with no action taken yet -- the first stage of the pipeline'},
    {c:'k6',k:'LCO pending'+forum,v:kn(lco),dv:dlt({metric:KPI_COL.lco}),
     d:lcoCov.have===lcoCov.of?share(lco):share(lco)+' · '+lcoCov.have+'/'+lcoCov.of+' reports',
     t:'LCO Proposal Stage (pending from department). Writ Appeal and '+
       'S-KSAT do not report this column, so they contribute nothing.'},
    {c:'k7',k:'Final order compliance'+forum,v:kn(finalOrd),d:share(finalOrd),
     dv:dlt({metric:KPI_COL.finalOrd}),
     t:'Final order compliance pending -- decided cases awaiting departmental compliance'}
  ];
  void active; void users; void divCount; void groupTotal; void groupUnits;

  var since=DATA.previous_date?(' vs '+DATA.previous_date):'';
  document.getElementById('kpis').innerHTML=cards.map(function(c){
    var dv='';
    if(c.dv!==null&&c.dv!==undefined){
      dv=(c.dv===0)
        ? '<span class="kd same" title="no change'+since+'">&ndash;</span>'
        : '<span class="kd '+(c.dv>0?'increase':'decrease')+'" title="'+
          (c.dv>0?'up ':'down ')+Math.abs(c.dv)+since+'">'+
          (c.dv>0?'&#9650;':'&#9660;')+Math.abs(c.dv)+'</span>';
    }
    return '<div class="kpi '+(c.c||'')+(c.accent?' accent':'')+'"'+
           (c.t?' title="'+esc(c.t)+'"':'')+'>'+
           '<div class="k">'+esc(c.k)+'</div>'+
           (c.html||('<div class="vrow"><span class="v">'+c.v+'</span>'+dv+'</div>'+
                     '<div class="d">'+esc(c.d)+'</div>'))+
           '</div>';
  }).join('');
}

// --- comparison period ---------------------------------------------------
// PERIOD picks which baseline every delta on the page is measured
// against. The builder writes one baseline per period onto every row and
// every officer, so switching period re-bases the KPI cards, the filter
// chips and the table together -- there is no second source of truth and
// nothing extra to render.
var PERIOD='d';

function periodOK(k){
  var b=(DATA&&DATA.baselines&&DATA.baselines[k])||null;
  return !!(b&&b.date);
}
// The baseline for a period can be older than its name suggests when the
// history is short -- with three snapshots "weekly" is really "vs 2 days
// ago". The label says so rather than overstating it.
function periodLabel(k){
  var b=(DATA&&DATA.baselines&&DATA.baselines[k])||{};
  if(!b.date) return (b.label||k)+' (not enough data)';
  return (b.label||k)+' \u00b7 vs '+b.span+'d ago';
}
function renderPeriodSelect(){
  var sel=document.getElementById('period');
  if(!sel) return;
  var keys=['d','w','m'];
  if(!periodOK(PERIOD)) PERIOD='d';
  sel.innerHTML=keys.map(function(k){
    return '<option value="'+k+'"'+(k===PERIOD?' selected':'')+
           (periodOK(k)?'':' disabled')+'>'+esc(periodLabel(k))+'</option>';
  }).join('');
  sel.disabled=!periodOK('d');
}
function setPeriod(k){
  if(!periodOK(k)) return;
  PERIOD=k;
  renderKPIs(); renderFilters(); renderPanel();
}
// The baseline figures for one row or officer under the active period.
function baseOf(rec){
  return (rec && rec.base_metrics && rec.base_metrics[PERIOD]) || null;
}


function renderFilters(){
  function row(label,inner,cls){
    return '<div class="frow '+cls+'"><span class="flabel">'+label+'</span>'+
           '<div class="fchips">'+inner+'</div></div>';
  }
  function chip(on,onclick,text,count,extra,title,delta){
    return '<div class="chip'+(on?' on':'')+(extra||'')+'"'+
      (onclick?' onclick="'+onclick+'"':'')+
      (title?' title="'+esc(title)+'"':'')+'>'+esc(text)+
      (count===undefined?'':'<span class="n">'+count+'</span>')+
      dHTMLsmall(delta)+'</div>';
  }
  var q=function(v){return JSON.stringify(v).replace(/"/g,'&quot;');};

  // HQ / Circle -- Aranya Bhavana sits alongside the 13 territorial
  // circles, so the row is named for both.
  var cl=circleList();
  var grand=cl.reduce(function(s,c){return s+c.total;},0);
  var clWas=dltBy({circle:'ALL',wing:'ALL',unit:'ALL'},'circle',function(b){return b.name;});
  var grandWas=clWas?Object.keys(clWas).reduce(function(s,k){return s+clWas[k];},0):null;
  var circleChips=chip(CIRCLE==='ALL',"setCircle('ALL')",'All',grand,'','',
                       grandWas===null?null:grand-grandWas)+
    cl.map(function(c){
      return chip(CIRCLE===c.name,'setCircle('+q(c.name)+')',
                  c.name.replace(/ Circle$/,''),c.total,c.total===0?' zero':'',c.name,
                  clWas?c.total-(clWas[c.name]||0):null);
    }).join('');

  // Wings / Divisions -- one row for both, because they are the same
  // level of the hierarchy reached by different routes: at Aranya
  // Bhavana the subdivision that matters is the wing, everywhere else it
  // is the division. Where a circle has both (the HQ departments do,
  // since the wings span all three) the wings come first, then a rule,
  // then the departments themselves.
  var wl=wingList(), ul=unitList();
  var subChips;
  if(CIRCLE==='ALL'){
    subChips=chip(true,'','All',tally({unit:'ALL'}))+
      '<span class="fhint">pick an HQ or circle above to list its '+
      (wl.length?wl.length+' wings and ':'')+ul.length+' divisions</span>';
  }else{
    var allOn=(WING==='ALL'&&UNIT==='ALL');
    subChips=chip(allOn,"setSub('ALL')",'All',tally({wing:'ALL',unit:'ALL'}),'','',
                  dlt({wing:'ALL',unit:'ALL'}));
    var wlWas=dltBy({wing:'ALL',unit:'ALL'},'wing',function(b){return b.name;});
    var ulWas=dltBy({unit:'ALL',wing:'ALL'},'unit',function(b){return b.code;});
    if(wl.length){
      subChips+=wl.map(function(w){
        return chip(WING===w.name,'setWing('+q(w.name)+')',shortWing(w.name),w.total,
                    w.total===0?' zero':'',
                    'Wing — '+w.name+', '+w.users+' user'+(w.users===1?'':'s'),
                    wlWas?w.total-(wlWas[w.name]||0):null);
      }).join('')+'<span class="fsep"></span>';
    }
    subChips+=ul.filter(function(u){return u.total>0||UNIT===u.code;}).map(function(u){
      return chip(UNIT===u.code,'setUnit('+q(u.code)+')',shortUnit(u.name),u.total,
                  u.total===0?' zero':'',u.name+' — '+(UNIT_KIND[u.group]||u.group),
                  ulWas?u.total-(ulWas[u.code]||0):null);
    }).join('');
  }

  // Mobile: once HQ/Circle or Wings/Divisions has an answer (from
  // onboarding or a manual pick), collapse it to a one-line summary --
  // "change" reopens the same chip list above rather than a separate
  // control, so there's only ever one way to alter a filter.
  var circleRowHTML, subRowHTML;
  if(IS_MOBILE && !MOB_CIRCLE_OPEN){
    var ccTotal = CIRCLE==='ALL' ? grand : (cl.filter(function(c){return c.name===CIRCLE;})[0]||{total:0}).total;
    circleRowHTML='<div class="frow f-circle"><span class="flabel">HQ / Circle</span>'+
      '<div class="fsum" onclick="mobToggleCircle()"><span class="fsl">'+
      esc(CIRCLE==='ALL'?'All circles':CIRCLE)+'<span class="n">'+ccTotal+'</span></span>'+
      '<span class="chg">change</span></div></div>';
  }else{
    circleRowHTML=row('HQ / Circle',circleChips,'f-circle');
  }
  if(IS_MOBILE && !MOB_UNIT_OPEN){
    var subLabel, subTotal;
    if(UNIT!=='ALL'){
      var uu=ul.filter(function(u){return u.code===UNIT;})[0];
      subLabel=uu?shortUnit(uu.name):UNIT; subTotal=uu?uu.total:0;
    }else if(WING!=='ALL'){
      var ww=wl.filter(function(w){return w.name===WING;})[0];
      subLabel=ww?shortWing(ww.name):WING; subTotal=ww?ww.total:0;
    }else{
      subLabel='All divisions'; subTotal=tally({wing:'ALL',unit:'ALL'});
    }
    subRowHTML='<div class="frow f-unit"><span class="flabel">Wings / Divisions</span>'+
      (CIRCLE==='ALL'
        ? '<div class="fchips"><span class="fhint">pick an HQ or circle above to set this</span></div>'
        : '<div class="fsum" onclick="mobToggleUnit()"><span class="fsl">'+esc(subLabel)+
          '<span class="n">'+subTotal+'</span></span><span class="chg">change</span></div>')+
      '</div>';
  }else{
    subRowHTML=row('Wings / Divisions',subChips,'f-unit');
  }

  // Court
  var courts=courtsOf().sort(function(a,b){
    return tally({court:b})-tally({court:a});
  });
  var courtChips=chip(COURT==='ALL',"setCourt('ALL')",'All courts',tally({court:'ALL'}),
                      '','',dlt({court:'ALL'}))+
    courts.map(function(c){
      var n=tally({court:c});
      return chip(COURT===c,'setCourt('+q(c)+')',
                  c.indexOf('Administrative')>=0?'KSAT':c,n,n===0?' zero':'',c,
                  dlt({court:c}));
    }).join('');

  // Case type. Mobile groups the chips under their court with a short
  // code instead of the full report name -- "WP" / "WA" / "CCP" /
  // "S-KSAT" under High Court, "Original" / "Misc" / "Review" /
  // "Contempt" under KSAT -- since both courts' reports are usually on
  // screen together and the full names don't fit. A group that has no
  // report in the current Court scope (e.g. Court is filtered to High
  // Court only) is simply not printed, rather than shown empty.
  var CT_CODE={'Writ Petition':'WP','Writ Appeal':'WA','Civil Contempt Petition':'CCP',
    'S-KSAT':'S-KSAT','Original Application':'Original','Contempt Application':'Contempt',
    'Miscellaneous Application':'Misc','Review Application':'Review'};
  function ctChip(ct){
    var n=pend(ct);
    return chip(CT===ct.key,'setCT('+q(ct.key)+')',CT_CODE[ct.label]||ct.label,n,n===0?' zero':'',
                ct.label+' — '+ct.court+(n===0?' — no pending cases in scope':''),
                dlt({ct:ct.key}));
  }
  var typeList=typesFor(COURT).slice().sort(function(a,b){return pend(b)-pend(a);});
  var typeChips=typeList.map(function(ct){
    var n=pend(ct);
    return chip(CT===ct.key,'setCT('+q(ct.key)+')',ct.label,n,n===0?' zero':'',
                ct.court+(n===0?' — checked, no pending cases in scope':''),
                dlt({ct:ct.key}));
  }).join('');
  var typeChipsMobile='';
  ['High Court','KSAT'].forEach(function(g){
    var list=typeList.filter(function(ct){return shortCourt(ct.court)===g;});
    if(!list.length) return;
    typeChipsMobile+='<div class="ctgrp"><div class="gl">'+g+'</div><div class="fchips">'+
      list.map(ctChip).join('')+'</div></div>';
  });

  var typeRowHTML = IS_MOBILE
    ? '<div class="frow f-type"><span class="flabel">Case type</span><div>'+typeChipsMobile+'</div></div>'
    : row('Case type',typeChips,'f-type');

  // Stage -- desktop only. On mobile every stage's count already sits
  // on its card as a tag (see mGroupsHTML), so a separate cross-unit
  // stage filter would duplicate a control without adding a screen's
  // worth of room to show it in. The trade-off: mobile can't filter
  // *across* units by stage the way desktop can -- only see each
  // unit's own breakdown.
  var stageRowHTML='';
  if(!IS_MOBILE){
    var sl=stageList().sort(function(a,b){return b.total-a.total;});
    var slWas=dltBy({stage:'ALL'},'stage',function(b){return b.key;});
    var stageChips=chip(STAGE==='ALL',"setStage('ALL')",'Any stage')+
      sl.map(function(st){
        return chip(STAGE===st.key,'setStage('+q(st.key)+')',st.label,st.total,
                    st.total===0?' zero':'',
                    st.units+' unit'+(st.units===1?'':'s')+' with cases at this stage',
                    slWas?st.total-(slWas[st.key]||0):null);
      }).join('');
    stageRowHTML=row('Stage',stageChips,'f-stage');
  }

  var active=(CIRCLE!=='ALL')+(WING!=='ALL')+(UNIT!=='ALL')+(COURT!=='ALL')+(STAGE!=='ALL');
  var resetHTML=active
    ? '<div style="padding:9px 0 2px;text-align:right"><span class="freset" onclick="resetFilters()">clear all filters</span></div>'
    : '';
  if(!IS_MOBILE && active) stageRowHTML = stageRowHTML.replace('</div></div>',
    '<span class="freset" onclick="resetFilters()">clear all filters</span></div></div>');

  document.getElementById('filters').innerHTML= IS_MOBILE
    ? circleRowHTML+subRowHTML+row('Court',courtChips,'f-court')+typeRowHTML+resetHTML
    : circleRowHTML+subRowHTML+row('Court',courtChips,'f-court')+typeRowHTML+stageRowHTML;
}

function setStage(s){STAGE=s; renderKPIs(); renderFilters(); renderPanel();}
function resetFilters(){
  CIRCLE='ALL'; WING='ALL'; UNIT='ALL'; COURT='ALL'; STAGE='ALL';
  MCARD={};
  if(IS_MOBILE){
    MOB_CIRCLE_OPEN=false; MOB_UNIT_OPEN=false;
    lsSet(LS_CIRCLE,'ALL'); lsSet(LS_UNIT,'ALL');
  }
  renderKPIs(); renderFilters(); renderPanel();
}

// Filters cascade downward: changing one clears anything below it that
// the new selection has made impossible, rather than leaving a stale
// chip lit over an empty table. On mobile, picking a value also closes
// its condensed row back up and remembers the choice for next visit --
// see the HQ/Circle and Wings/Divisions rows in renderFilters().
function setCircle(c){
  CIRCLE=c; WING='ALL'; UNIT='ALL'; MCARD={};
  if(IS_MOBILE){
    MOB_CIRCLE_OPEN=false; MOB_UNIT_OPEN=false;
    lsSet(LS_CIRCLE,c); lsSet(LS_UNIT,'ALL');
  }
  renderKPIs(); renderFilters(); renderPanel();
}
// Wing and division share one filter row, so they behave as one control:
// picking either clears the other. Selecting "Legal Cell" and then a
// division would otherwise read as an intersection, which is not what
// the row offers.
function setWing(w){
  WING=w; UNIT='ALL'; MCARD={};
  if(IS_MOBILE){ MOB_UNIT_OPEN=false; lsSet(LS_UNIT,'ALL'); }
  renderKPIs(); renderFilters(); renderPanel();
}
function setUnit(u){
  UNIT=u; WING='ALL'; MCARD={};
  if(IS_MOBILE){ MOB_UNIT_OPEN=false; lsSet(LS_UNIT,u); }
  renderKPIs(); renderFilters(); renderPanel();
}
function setSub(){
  WING='ALL'; UNIT='ALL'; MCARD={};
  if(IS_MOBILE){ MOB_UNIT_OPEN=false; lsSet(LS_UNIT,'ALL'); }
  renderKPIs(); renderFilters(); renderPanel();
}
// Toggle handlers for the condensed rows' "change" link -- reopen the
// full chip list without touching the selection underneath it.
function mobToggleCircle(){ MOB_CIRCLE_OPEN=!MOB_CIRCLE_OPEN; renderFilters(); }
function mobToggleUnit(){ MOB_UNIT_OPEN=!MOB_UNIT_OPEN; renderFilters(); }

function setCourt(c){
  COURT=c; MCARD={};
  var list=typesFor(COURT);
  var still=list.some(function(x){return x.key===CT&&pend(x)>0;});
  if(!still){var f=list.filter(function(x){return pend(x)>0;})[0]; CT=f?f.key:(list[0]&&list[0].key);}
  renderKPIs(); renderFilters(); renderPanel();
}
function setCT(k){CT=k; MCARD={}; renderFilters(); renderPanel();}

// ---- First-visit mobile preference sheet -----------------------------
// Asks which circle, then (if a specific one was picked) which division,
// and remembers the answer in localStorage so it only runs once per
// phone. Either step can be skipped -- this is a shortcut to a sensible
// default, not a login, and nothing here is enforced or authenticated.
function showOnboard(step,chosenCircle){
  var ov=document.getElementById('obkOv');
  if(!ov){
    ov=document.createElement('div'); ov.id='obkOv'; ov.className='obk-ov';
    document.body.appendChild(ov);
  }
  if(step===1){
    var circles=(DATA.circles||[]).slice();
    ov.innerHTML='<div class="obk-sheet"><div class="obk-grab"></div>'+
      '<p class="obk-t">Which HQ or circle are you interested in?</p>'+
      '<p class="obk-d">Filters to this by default on this phone. Change it anytime from HQ / Circle.</p>'+
      '<div class="obk-list">'+circles.map(function(c){
        return '<div class="obk-opt" onclick="obkPickCircle('+qa(c)+')">'+esc(c)+'</div>';
      }).join('')+'</div>'+
      '<div class="obk-actions">'+
        '<button class="obk-skip" onclick="obkPickCircle(&quot;ALL&quot;)">Skip, show all circles</button>'+
      '</div></div>';
  }else{
    var units=unitList();
    ov.innerHTML='<div class="obk-sheet"><div class="obk-grab"></div>'+
      '<p class="obk-t">Which division, in '+esc(chosenCircle)+'?</p>'+
      '<p class="obk-d">Optional -- narrows things further. Change anytime from Wings / Divisions.</p>'+
      '<div class="obk-list">'+units.map(function(u){
        return '<div class="obk-opt" onclick="obkPickUnit('+qa(u.code)+')">'+esc(shortUnit(u.name))+
          '<span class="gt"> &middot; '+(UNIT_KIND[u.group]||u.group)+'</span></div>';
      }).join('')+'</div>'+
      '<div class="obk-actions">'+
        '<button class="obk-skip" onclick="obkPickUnit(&quot;ALL&quot;)">Skip, show all divisions</button>'+
      '</div></div>';
  }
}
function obkPickCircle(c){
  CIRCLE=c; WING='ALL'; UNIT='ALL'; MCARD={};
  lsSet(LS_CIRCLE,c);
  renderKPIs(); renderFilters(); renderPanel();
  if(c==='ALL'){ lsSet(LS_UNIT,'ALL'); closeOnboard(); }
  else{ showOnboard(2,c); }
}
function obkPickUnit(u){
  UNIT=u; MCARD={};
  lsSet(LS_UNIT,u);
  renderKPIs(); renderFilters(); renderPanel();
  closeOnboard();
}
function closeOnboard(){
  var ov=document.getElementById('obkOv');
  if(ov) ov.parentNode.removeChild(ov);
}

function headHTML(ct){
  var cols=ct.columns;
  var hasC=cols.some(function(c){return COMPLETED.indexOf(c.key)>=0;});
  if(!hasC){
    return '<tr><th class="nm">Department name</th>'+cols.map(function(c){
      return '<th'+(c.key===STAGE?' class="stg"':'')+' title="'+esc(c.header)+'">'+
        esc(shortOf(c))+'</th>';}).join('')+'</tr>';
  }
  var pre=cols.filter(function(c){return COMPLETED.indexOf(c.key)<0;});
  return '<tr><th class="nm" rowspan="2">Department name</th>'+
    pre.map(function(c){return '<th rowspan="2"'+(c.key===STAGE?' class="stg"':'')+
      ' title="'+esc(c.header)+'">'+esc(shortOf(c))+'</th>';}).join('')+
    '<th class="grp" colspan="'+COMPLETED.length+'">Completed case</th></tr>'+
    '<tr>'+COMPLETED.map(function(k){
      var c=cols.filter(function(x){return x.key===k;})[0];
      return c?'<th'+(c.key===STAGE?' class="stg"':'')+' title="'+esc(c.header)+'">'+
        esc(shortOf(c))+'</th>':'';}).join('')+'</tr>';
}
function cellClass(k){
  if(k===STAGE) return ' class="stg"';
  if(k==='total_cases_pending') return ' class="tot"';
  return '';
}
function cells(m,cols){
  return cols.map(function(c){
    return '<td'+cellClass(c.key)+'>'+num(m[c.key])+'</td>';
  }).join('');
}

// Users listed under a unit. For most units that is a flat list. For the
// Aranya Bhavana departments the builder tags each user with the wing it
// belongs to (from scraper/wings.json), so those are grouped: one
// subtotal row per wing, heaviest first, with its users beneath it.
// A unit is never half-grouped -- if any user carries a wing, every user
// does, falling back to "Unassigned".
function userRows(r,i,cols,sortKey){
  var us=r.users.slice().sort(function(x,y){
    return (y.metrics[sortKey]||0)-(x.metrics[sortKey]||0);
  });
  function urow(u,inWing){
    return '<tr class="u'+(inWing?' inw':'')+'" data-p="'+i+'" style="display:none">'+
      '<td class="nm">'+esc(u.post)+recDeltaHTML(u)+
      (u.section?'<div class="us">'+esc(u.section)+'</div>':'')+'</td>'+
      cells(u.metrics,cols)+'</tr>';
  }
  // With a wing already selected the row *is* that wing, so the subtotal
  // header would just restate the row above it -- list the users flat.
  var winged=WING==='ALL'&&us.some(function(u){return u.wing;});
  if(!winged) return us.map(function(u){return urow(u,false);}).join('');

  var order=[],by={};
  us.forEach(function(u){
    var w=u.wing||'Unassigned';
    if(!by[w]){by[w]=[];order.push(w);}
    by[w].push(u);
  });
  function sum(list,k){
    return list.reduce(function(s,u){
      var v=u.metrics[k]; return s+(typeof v==='number'?v:0);},0);
  }
  order.sort(function(a,b){return sum(by[b],sortKey)-sum(by[a],sortKey);});

  return order.map(function(w){
    var list=by[w],m={};
    cols.forEach(function(c){m[c.key]=sum(list,c.key);});
    // Flag the buckets that are not a real wing -- field offices created
    // under the HQ department code, and the CCMS Admin system account.
    var odd=/^(Field offices|System account|Unassigned)/.test(w);
    return '<tr class="wg'+(odd?' um':'')+'" data-p="'+i+'" style="display:none">'+
      '<td class="nm">'+esc(w)+'<span class="gt"> &middot; '+list.length+
      ' user'+(list.length===1?'':'s')+'</span></td>'+
      cells(m,cols)+'</tr>'+
      list.map(function(u){return urow(u,true);}).join('');
  }).join('');
}

// Report-level caveat about column headings -- identical on mobile and
// desktop, factored out so the two renderers can't drift.
function noteHTML(ct){
  if(!ct.all_columns_known){
    return '<div class="note"><strong>Column names unavailable.</strong> This report renders '+ct.column_count+
      ' columns and the XML export omits their headings. The first two are verified as Cases Received / '+
      'Total Cases Pending. Re-run the scraper to capture the real headings from the rendered report.</div>';
  }
  var scraped=ct.columns.some(function(c){return c.scraped;});
  if(scraped){
    return '<div class="note"><strong>Note:</strong> column names beyond the first two were read from the '+
      'rendered report rather than a published schema. Worth a sanity check against the site.</div>';
  }
  return '';
}

// ---- Mobile card table ----------------------------------------------
// Splits a report's columns the same way the desktop "Completed case"
// header group already does (COMPLETED array), so a card shows two
// labelled tag groups instead of a table's worth of headers. Zero and
// missing values are simply omitted rather than shown as "0" tags --
// on a division with 17 possible stages, most are zero, and a card
// full of zero-tags is worse than a shorter one.
function pipelineCols(cols){
  return cols.filter(function(c){
    return c.key!=='cases_received_as_on_yesterday' && c.key!=='total_cases_pending' &&
           COMPLETED.indexOf(c.key)<0;
  });
}
function completedCols(cols){
  return cols.filter(function(c){ return COMPLETED.indexOf(c.key)>=0; });
}
function mTagsHTML(m,cols,doneCls){
  return cols.filter(function(c){ return typeof m[c.key]==='number' && m[c.key]>0; })
    .map(function(c){
      return '<span class="mtag'+(doneCls?' done':'')+'">'+esc(shortOf(c))+' <b>'+m[c.key]+'</b></span>';
    }).join('');
}
function mGroupsHTML(m,cols){
  var out='';
  var p=mTagsHTML(m,pipelineCols(cols),false);
  if(p) out+='<div class="mgrp"><div class="gl">Pipeline</div><div class="mtags">'+p+'</div></div>';
  var c=mTagsHTML(m,completedCols(cols),true);
  if(c) out+='<div class="mgrp done"><div class="gl">Completed</div><div class="mtags">'+c+'</div></div>';
  return out;
}
function mCardState(i){ return MCARD[i]||(MCARD[i]={open:false,drill:null}); }
function mToggleUsers(i){
  var st=mCardState(i); st.open=!st.open; st.drill=null; renderPanel();
}
function mDrillUser(i,ui){
  var st=mCardState(i); st.open=true; st.drill=ui; renderPanel();
}
function mDrillBack(i){
  var st=mCardState(i); st.drill=null; renderPanel();
}
// One division's card -- or, if a user has been tapped, that user's
// card in its place with a breadcrumb and a way back. The division's
// own users list stays open underneath so drilling into one officer
// doesn't lose the rest of the roster.
function mobCard(r,i,cols){
  var st=mCardState(i);
  var n=r.users.length;
  if(st.drill!=null && r.users[st.drill]){
    var u=r.users[st.drill];
    var h='<div class="mcrumb"><span onclick="mDrillBack('+i+')" style="text-decoration:underline;cursor:pointer">'+
      esc(r.name)+'</span> &rsaquo; <span class="cur">'+esc(u.post)+'</span></div>'+
      '<div class="mh"><span class="mname">'+esc(u.post)+'</span>'+
      '<span class="mtot">'+num(u.metrics.total_cases_pending)+'</span></div>'+
      '<div class="mmeta">'+esc(u.section||'')+recDeltaHTML(u)+'</div>';
    if(typeof u.metrics.cases_received_as_on_yesterday==='number')
      h+='<div class="mrecv">Received as on yesterday: '+u.metrics.cases_received_as_on_yesterday+'</div>';
    h+=mGroupsHTML(u.metrics,cols);
    h+='<div class="mback" onclick="mDrillBack('+i+')">&larr;&nbsp;back to '+esc(r.name)+'</div>';
    return '<div class="mcard">'+h+'</div>';
  }
  var h='<div class="mh"><span class="mname'+(n?' lk':'')+'"'+
    (n?' onclick="mToggleUsers('+i+')"':'')+'>'+esc(r.name)+'</span>'+
    '<span class="mtot">'+num(r.metrics.total_cases_pending)+'</span></div>'+
    '<div class="mmeta">'+esc(UNIT_KIND[r.group]||r.group)+
    (n?' &middot; '+n+' user'+(n===1?'':'s'):'')+recDeltaHTML(r)+'</div>';
  if(typeof r.metrics.cases_received_as_on_yesterday==='number')
    h+='<div class="mrecv">Received as on yesterday: '+r.metrics.cases_received_as_on_yesterday+'</div>';
  h+=mGroupsHTML(r.metrics,cols);
  if(n){
    h+='<div class="mshow" onclick="mToggleUsers('+i+')">'+
      '<span>'+(st.open?'hide':'show')+' '+n+' user'+(n===1?'':'s')+'</span></div>';
    if(st.open){
      h+='<div class="museres">'+r.users.map(function(u,ui){
        return '<div class="muser" onclick="mDrillUser('+i+','+ui+')">'+
          '<div class="mh"><span class="mname" style="font-size:11.5px">'+esc(u.post)+'</span>'+
          '<span class="mtot" style="font-size:12.5px">'+num(u.metrics.total_cases_pending)+'</span></div>'+
          '<div class="mmeta" style="font-size:9.5px">'+esc(u.section||'')+recDeltaHTML(u)+'</div></div>';
      }).join('')+'</div>';
    }
  }
  return '<div class="mcard">'+h+'</div>';
}
function renderPanelMobile(ct,ROWS,cols){
  var cards=ROWS.map(function(r,i){return mobCard(r,i,cols);}).join('');
  return '<div class="panel"><div class="phead">'+
      '<h2>'+esc(ct.label)+' report'+(ct.all_columns_known?'':'<span class="badge">partial headings</span>')+'</h2>'+
      '<span class="m">'+esc(ct.court)+' &middot; '+ROWS.length+' unit'+(ROWS.length===1?'':'s')+'</span></div>'+
      '<div class="mcards">'+cards+'</div></div>'+noteHTML(ct);
}

function renderPanel(){
  var ct=DATA.case_types.filter(function(x){return x.key===CT;})[0];
  var el=document.getElementById('panel');
  if(!ct){el.innerHTML='';return;}
  var ROWS=rowsOf(ct);
  if(!ROWS.length){
    el.innerHTML='<div class="panel"><div class="phead">'+
      '<h2>'+esc(ct.label)+' report &mdash; non secretariat department</h2>'+
      '<span class="m">'+esc(ct.court)+'</span></div>'+
      '<div class="empty"><strong>No pending cases.</strong><br>'+
      'This report was fetched successfully &mdash; no '+
      (CIRCLE==='ALL'?'tracked unit':'unit in '+esc(CIRCLE))+
      (WING==='ALL'?'':' under '+esc(WING))+
      (UNIT==='ALL'?'':' matching that unit')+
      (STAGE==='ALL'?'':' has cases at that stage, and none')+
      ' has a pending '+esc(ct.label)+' case.</div></div>';
    return;
  }
  var cols=ct.columns;
  // Ordered by caseload -- by the selected stage if one is active, else
  // by total pending.
  var sortKey = STAGE==='ALL' ? 'total_cases_pending' : STAGE;
  ROWS=ROWS.slice().sort(function(a,b){
    return (b.metrics[sortKey]||0)-(a.metrics[sortKey]||0);
  });
  if(IS_MOBILE){
    el.innerHTML=renderPanelMobile(ct,ROWS,cols);
    return;
  }
  var body=ROWS.map(function(r,i){
    var n=r.users.length;
    // The name itself opens the user list -- no separate caret column.
    var nm=n?'<a class="dl" id="c'+i+'" onclick="tog('+i+')" title="Show the '+n+
              ' user row'+(n===1?'':'s')+' under '+esc(r.name)+'">'+esc(r.name)+'</a>'
           :'<span>'+esc(r.name)+'</span>';
    var main='<tr><td class="nm"><span class="dn">'+nm+
      recDeltaHTML(r)+'</span><span class="gt">'+esc(UNIT_KIND[r.group]||r.group)+
      (n?' &middot; '+n+' user'+(n===1?'':'s'):'')+
      '</span></td>'+cells(r.metrics,cols)+'</tr>';
    return main+userRows(r,i,cols,sortKey);
  }).join('');

  var ftot={};
  cols.forEach(function(c){
    ftot[c.key]=ROWS.reduce(function(s,r){
      var v=r.metrics[c.key]; return s+(typeof v==='number'?v:0);},0);
  });
  var foot='<tr><td class="nm">Total &mdash; '+ROWS.length+' unit'+(ROWS.length===1?'':'s')+
    (CIRCLE==='ALL'?'':' in '+esc(CIRCLE))+
    (WING==='ALL'?'':' &middot; '+esc(WING)+' only')+
    '</td>'+cols.map(function(c){
      return '<td'+cellClass(c.key)+'>'+num(ftot[c.key])+'</td>';
    }).join('')+'</tr>';

  var note=noteHTML(ct);

  el.innerHTML='<div class="panel"><div class="phead">'+
      '<h2>'+esc(ct.label)+' report &mdash; non secretariat department'+
      (ct.all_columns_known?'':'<span class="badge">partial headings</span>')+'</h2>'+
      '<span class="m">'+esc(ct.court)+' &middot; '+ct.column_count+' columns &middot; '+
      ROWS.length+' unit'+(ROWS.length===1?'':'s')+'</span></div>'+
      '<div class="scroll"><table><thead>'+headHTML(ct)+'</thead><tbody>'+body+
      '</tbody><tfoot>'+foot+'</tfoot></table></div></div>'+note;
}

function tog(i){
  var rows=document.querySelectorAll('tr.u[data-p="'+i+'"],tr.wg[data-p="'+i+'"]');
  var c=document.getElementById('c'+i);
  var open=rows.length&&rows[0].style.display!=='none';
  for(var j=0;j<rows.length;j++) rows[j].style.display=open?'none':'';
  if(c) c.className='dl'+(open?'':' open');
}

async function loadData(FORCE){
  var st=document.getElementById('stamp');
  st.textContent='Loading…';
  var d=null,src='';
  try{
    // Default caching on purpose. The data changes once a day, so the
    // Cache-Control header (30 min + stale-while-revalidate) is what
    // keeps bandwidth flat as the audience grows. 'no-store' would
    // override it and force a full re-download on every page view.
    // The Refresh button passes cache:'reload' for an explicit bypass.
    var r=await fetch('data.json', FORCE ? {cache:'reload'} : {});
    if(!r.ok) throw new Error('HTTP '+r.status);
    d=await r.json(); src='data.json';
  }catch(e){ if(window.CCMS_DATA){d=window.CCMS_DATA;src='data.js';} }
  if(!d){st.textContent='Could not load data. Run the scraper, or serve this folder with: python3 -m http.server';return;}
  DATA=d;
  // Apply a saved mobile preference before the first render so the page
  // never flashes "all circles" and then jumps -- desktop never reads
  // these keys, so a phone and a desktop sharing a browser profile
  // don't interfere with each other.
  var savedCircle=IS_MOBILE?lsGet(LS_CIRCLE):null;
  if(savedCircle!==null){
    CIRCLE=savedCircle;
    var savedUnit=lsGet(LS_UNIT);
    if(savedUnit!==null) UNIT=savedUnit;
  }
  if(!DATA.case_types||!DATA.case_types.length){
    document.getElementById('panel').innerHTML='<div class="panel"><div class="empty">No case-type detail — re-run the scraper.</div></div>';
    st.textContent='Data as on '+(DATA.latest_date?ddmm(DATA.latest_date):'unknown'); return;
  }
  var withData=DATA.case_types.filter(function(c){return pend(c)>0;});
  if(!CT||!DATA.case_types.some(function(c){return c.key===CT;}))
    CT=(withData[0]||DATA.case_types[0]).key;
  renderPeriodSelect();
  renderKPIs(); renderFilters(); renderPanel();
  st.textContent='Data as on '+ddmm(DATA.latest_date)+
    (DATA.previous_date?' · vs '+ddmm(DATA.previous_date):' · no prior snapshot yet')+
    (src==='data.js'?' · offline copy':'');
  if(IS_MOBILE && savedCircle===null) showOnboard(1);
}
loadData();
</script>
