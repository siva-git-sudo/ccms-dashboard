name: Test CCMS Access

on:
  workflow_dispatch:

jobs:
  test-ccms:
    runs-on: ubuntu-latest
    steps:
      - name: Test CCMS connectivity
        run: |
          python - <<'PY'
          import urllib.request
          import sys

          url = "http://117.252.94.131/Budget/Circle/Circle_PerformanceReport.aspx"
          print(f"Testing: {url}")
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"HTTP status: {response.status}")
                  print(f"Final URL: {response.geturl()}")
                  data = response.read(1000)
                  print(f"Received {len(data)} bytes")
                  print(data[:500])
          except Exception as e:
              print(f"CCMS access failed: {type(e).__name__}: {e}")
              sys.exit(1)
          PY
