name: Publish dashboard

# Publishes public/ to GitHub Pages every time you push.
#
# This is the workflow that matters for the "scrape on the Mac, push to
# GitHub" setup: your machine does the scraping (from an Indian IP, which
# the CCMS site accepts) and pushes the result; GitHub only serves the
# files. It never touches ccms.karnataka.gov.in, so it cannot fail for
# network reasons.
#
# Publishing from public/ via an artifact -- rather than Pages' built-in
# "deploy from a branch" -- because that option only serves the repo root
# or /docs, and the site lives in public/.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: ccms-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
