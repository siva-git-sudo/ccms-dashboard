name: Scrape CCMS and publish dashboard

# Runs the scraper on GitHub's servers every morning, commits the new
# snapshot back to the repo, and publishes public/ to GitHub Pages.
#
# The snapshot commit is not optional book-keeping: the increase/decrease
# arrows are computed by comparing today's snapshot with the previous
# one, so the history has to persist in the repo. A workflow that only
# published the site without committing data/snapshots/ would start from
# scratch every run and never show an arrow.

on:
  schedule:
    # 02:00 UTC = 07:30 IST. GitHub cron is UTC only.
    - cron: '0 2 * * *'
  workflow_dispatch:        # lets you run it on demand from the Actions tab

permissions:
  contents: write           # to commit the snapshot
  pages: write              # to publish
  id-token: write

concurrency:
  group: ccms-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # scraper/ is a Git submodule in this repository, so it must be
      # checked out explicitly before requirements.txt and scrape_ccms.py
      # can be used.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check the CCMS site is reachable from this runner
        run: |
          echo "Checking https://ccms.karnataka.gov.in ..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://ccms.karnataka.gov.in/ccms/StateReport.aspx || echo "000")
          echo "HTTP status: $code"
          if [ "$code" = "000" ]; then
            echo "::error::Cannot reach ccms.karnataka.gov.in from a GitHub runner."
            echo "::error::Some Indian government sites block non-Indian IP ranges."
            echo "::error::If this keeps failing, use the self-hosted option instead"
            echo "::error::(run the scraper on your own machine and push the result)."
            exit 1
          fi

      - name: Run the scraper
        working-directory: scraper
        run: python scrape_ccms.py

      - name: Commit the new snapshot
        run: |
          git config user.name  "ccms-bot"
          git config user.email "ccms-bot@users.noreply.github.com"
          git add data/snapshots public/data.json public/data.js
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "CCMS snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "### CCMS scrape finished" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              d = json.load(open("public/data.json"))
              tot = sum((c.get("totals", {}).get("total_cases_pending") or 0)
                        for c in d.get("case_types", []))
              print(f"- data as of **{d.get('latest_date')}**")
              print(f"- total pending: **{tot}**")
              print(f"- compared against: {d.get('previous_date') or 'no earlier snapshot yet'}")
          except Exception as e:
              print(f"- could not summarise: {e}")
          PY

# Publishing is handled by publish.yml, which fires on the commit this
# workflow pushes. Deploying from here as well would mean two concurrent
# deployments to the same Pages site.
